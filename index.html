<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mini Player</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="cabecalho">
        <nav>
            <img id="logo-ytmusic" src="assets/logo-ytmusic.svg" alt="Logo YouTube Music">
            <p class="logo-music">Music</p>
            <p class="status">ONLINE • Premium</p>
        </nav>
    </header>
    <main>
        <section class="player-musica">
            <img id="capa-album" src="assets/capa-player.svg" alt="Capa do album em execução.">
            <div class="resolucao-video">
                <img class="icone-resolucao" src="assets/hd-display.svg" alt="Icone video em HD">
                <p>1080p</p>
            </div>
            <div class="video-musica">
                <img class="icone-musica-video" src="assets/nota-musical.svg" alt="Nota Musical">
                <p>Música • Vídeo</p>
            </div>
            <p class="timestamp">02:15 / 03:40</p>
            <button type="button" class="button-like">♥ CURTIR</button>
        </section>
    </main>


</body>

</html>
